stages:
  - test
  - build

variables:
  JEST_JUNIT_OUTPUT_DIR: "reports/junit"
  JEST_JUNIT_OUTPUT_NAME: "junit.xml"
  FORCE_COLOR: "3"
  TERM: "xterm-256color"
  NPM_CONFIG_COLOR: "always"
  # Docker registry configuration
  DOCKER_IMAGE_NAME: "reg.lastsecondtours.com/lastsecond/$CI_PROJECT_NAME"
  # Set Docker tag based on branch
  DOCKER_TAG: "$CI_COMMIT_BRANCH"

default:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - node_modules/

test:unit:
  image: node:20-bullseye
  stage: test
  tags: ["Last-Runner-Local-Doc"]
  before_script:
    - node --version
    - npm --version
    - npm ci --prefer-offline --no-audit --cache .npm
    # --- Ensure .env exists for tests ---
    - |
      if [ ! -f .env ]; then
        if [ -f .env.example ]; then
          echo "No .env found; copying from .env.example"
          cp .env.example .env
        else
          echo "WARNING: Neither .env nor .env.example exists. Creating empty .env"
          touch .env
        fi
      fi
  script:
    - npm install --no-save jest-junit
    - mkdir -p "$JEST_JUNIT_OUTPUT_DIR"
    - JEST_JUNIT_OUTPUT="$JEST_JUNIT_OUTPUT_DIR/$JEST_JUNIT_OUTPUT_NAME" npm test -- --runInBand --ci --colors --coverage --reporters=default --reporters=jest-junit --coverageReporters=cobertura --coverageReporters=text-summary
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: $JEST_JUNIT_OUTPUT_DIR/$JEST_JUNIT_OUTPUT_NAME
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
      - $JEST_JUNIT_OUTPUT_DIR/$JEST_JUNIT_OUTPUT_NAME
  only:
    - master
    - stage
    - cicd

build:docker:
  stage: build
  needs: ["test:unit"]
  tags: ["Last-Runner-Local"]
  before_script:
    - docker info
  script:
    # Build Docker image with multi-stage Dockerfile
    - echo "Building Docker image for branch $CI_COMMIT_BRANCH..."
    - |
      docker build \
        --build-arg NODE_ENV=production \
        --tag "$DOCKER_IMAGE_NAME:$DOCKER_TAG" \
        --tag "$DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA" \
        --tag "$DOCKER_IMAGE_NAME:$DOCKER_TAG-$CI_COMMIT_SHORT_SHA" \
        .
    
    # Push all tags
    - echo "Pushing Docker images..."
    - docker push "$DOCKER_IMAGE_NAME:$DOCKER_TAG"
    - docker push "$DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKER_IMAGE_NAME:$DOCKER_TAG-$CI_COMMIT_SHORT_SHA"
    
    # Display pushed images
    - echo "Successfully pushed images:"
    - echo "  - $DOCKER_IMAGE_NAME:$DOCKER_TAG"
    - echo "  - $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - echo "  - $DOCKER_IMAGE_NAME:$DOCKER_TAG-$CI_COMMIT_SHORT_SHA"
  only:
    - master
    - stage
    - cicd
